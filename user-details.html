<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farming Details - GreenLife</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="details-container">
        <h2>Enter Your Farming Details</h2>
        <form action="thank-you.html" method="POST" enctype="multipart/form-data">
            <input type="text" name="name" placeholder="Enter Your Name" required><br>
            <input type="text" name="location" placeholder="Enter Your Location" required><br>
            <select name="farm-type" required>
                <option value="">Select Type of Farming Place</option>
                <option value="terrace">Terrace</option>
                <option value="farmland">Farmland</option>
                <option value="greenhouse">Greenhouse</option>
            </select><br>

            <!-- Image Upload Field -->
            <input type="file" name="farm-image" accept="image/*" required><br><br>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>

</html>
